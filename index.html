<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style/style.css">

    <link rel="shortcut icon" href="./favicons/favicon-16x16.png" type="image/x-icon">

    <script defer src="./script/script.js"></script>

    <title>Pokédex</title>
</head>

<body>

    <main>
        <img src="#" alt="pokemon" class="pokemon_image">

        <img src="./images/pokedex.png" class="pokedex" alt="pokedex">

<form class="form" method="get">
    <input 
    type="search"
    class="input_search"
    placeholder="Name or Number"
    required>
</form>

        <h1 class="pokemon_data">
            <span class="pokemon_id"></span> -
            <span class="pokemon_name"></span>
        </h1>

        <div class="buttons">
            <button class="button previous_button">Prev &lt;</button>
            <button class="button next_button"> Next ></button>
        </div>

    </main>

</body>

</html>
