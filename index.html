<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Links -->
    <link rel="stylesheet" href="./style/style.css">
    <link rel="shortcut icon" href="./favicon/favicon-16x16.png" type="image/x-icon">
    <!-- Main Script -->
    <script type="module" src="./script/dist/script.js" defer></script>
</head>

<body>

    <div class="pokedex">

        <div class="pokedexItems">

            <div class="pokedexInterface">

                <img class="pokedexImage" src="./images/pokedex.png" alt="Pokedex">
                <img class="pokemonImage" src="" alt="Pokémon">

                <div class="pokemonData">
                    <span class="pokemonNumber"></span>
                    <p class="pokemonName"></p>
                </div>

                <form class="pokemonSearch">
                    <input class="inputSearch" type="search" name="Pokémon" placeholder="Name or ID" required>
                </form>

                <div class="pokedexButtons">
                    <button class="button previousButton">&lt;</button>
                    <button class="button nextButton">&gt;</button>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
